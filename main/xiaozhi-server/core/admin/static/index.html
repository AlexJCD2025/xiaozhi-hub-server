<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xiaozhi-hub 管理后台</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2129; --muted: #6b7280;
    --border: #e5e7eb; --primary: #2563eb; --primary-text: #ffffff;
    --ok: #15803d; --warn: #b45309; --err: #b91c1c; --tag: #eef2ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318; --card: #1a1d24; --text: #e5e7eb; --muted: #9ca3af;
      --border: #2d323c; --primary: #3b82f6; --primary-text: #ffffff;
      --ok: #4ade80; --warn: #fbbf24; --err: #f87171; --tag: #232a3d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { padding: 16px; border-bottom: 1px solid var(--border); background: var(--card);
           display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 16px; margin: 0; }
  main { max-width: 820px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
          padding: 16px; margin-bottom: 12px; }
  .card h2 { font-size: 15px; margin: 0 0 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--muted); font-size: 13px; }
  .tag { background: var(--tag); border-radius: 4px; padding: 0 6px; font-size: 12px; font-weight: normal; }
  .tag.ok { color: var(--ok); } .tag.warn { color: var(--warn); }
  label { display: block; margin-top: 10px; font-size: 13px; color: var(--muted); }
  input, select { width: 100%; padding: 8px 10px; margin-top: 4px; border: 1px solid var(--border);
                  border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
  button { margin-top: 12px; padding: 8px 16px; border: 0; border-radius: 6px; cursor: pointer;
           background: var(--primary); color: var(--primary-text); font: inherit; }
  button.link { background: none; color: var(--muted); padding: 0; margin: 0; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  .row > :first-child { flex: 1; }
  .hidden { display: none; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 8px 16px;
           border-radius: 6px; background: var(--text); color: var(--bg); opacity: 0; transition: opacity .2s; }
  #toast.show { opacity: .92; }
  details summary { cursor: pointer; color: var(--muted); margin: 8px 0; }
</style>
</head>
<body>
<header>
  <h1>xiaozhi-hub 管理后台</h1>
  <button id="logout" class="link hidden">退出登录</button>
</header>
<main>
  <section id="setup" class="card hidden">
    <h2>设置管理后台密码</h2>
    <p class="muted">首次使用请设置访问密码（至少 6 位）。设置后，局域网内的其他设备也可以凭密码登录。</p>
    <label>密码<input id="setup-pw" type="password" autocomplete="new-password"></label>
    <label>再次输入<input id="setup-pw2" type="password" autocomplete="new-password"></label>
    <button id="setup-btn">设置并进入</button>
  </section>

  <section id="setup-remote" class="card hidden">
    <h2>尚未设置密码</h2>
    <p class="muted">为了安全，首次设置密码只能在运行服务的电脑上进行。请在那台电脑的浏览器中打开
      <code>http://127.0.0.1:8003/admin</code>。</p>
  </section>

  <section id="login" class="card hidden">
    <h2>登录</h2>
    <label>密码<input id="login-pw" type="password" autocomplete="current-password"></label>
    <button id="login-btn">登录</button>
  </section>

  <section id="panel" class="hidden">
    <div class="card">
      <h2>当前大模型</h2>
      <p class="muted" id="running-hint"></p>
      <div class="row">
        <label>选择要使用的模型<select id="llm-select"></select></label>
        <button id="select-btn">切换</button>
      </div>
    </div>
    <div id="llm-list"></div>
  </section>
</main>
<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const COMMON = ["ClaudeAPI", "ChatGLMLLM", "DeepSeekLLM", "AliLLM", "DoubaoLLM"];

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), 2600);
}

async function api(path, body) {
  const opts = body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  };
  const res = await fetch("/admin/api/" + path, opts);
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (res.status === 401 && path !== "login") { await route(); throw new Error("请重新登录"); }
  if (!res.ok || data.ok === false) throw new Error(data.error || ("请求失败：" + res.status));
  return data;
}

function show(id) {
  for (const s of ["setup", "setup-remote", "login", "panel"]) $(s).classList.toggle("hidden", s !== id);
  $("logout").classList.toggle("hidden", id !== "panel");
}

async function route() {
  const st = await (await fetch("/admin/api/state")).json();
  if (st.needs_setup) show(st.is_local ? "setup" : "setup-remote");
  else if (!st.logged_in) show("login");
  else { show("panel"); await loadLLM(); }
}

function appliedMsg(r) {
  return r.applied ? "已保存并生效（设备重新连接后使用新配置）" : "已保存，重启服务后生效";
}

function fieldInput(item, field, label) {
  if (!(field in item.fields)) return "";
  const v = esc(item.fields[field]);
  return `<label>${label}<input data-field="${field}" value="${v}" autocomplete="off"></label>`;
}

function renderItem(item, selected) {
  const div = document.createElement("div");
  div.className = "card";
  const keyTag = item.api_key_set === undefined ? "" :
    item.api_key_set ? `<span class="tag ok">Key 已设置 ${esc(item.api_key_hint)}</span>`
                     : `<span class="tag warn">Key 未设置</span>`;
  const keyInput = item.api_key_set === undefined ? "" :
    `<label>API Key（留空表示不修改）<input data-field="api_key" type="password" autocomplete="off"
      placeholder="${item.api_key_set ? "已设置，输入新值可替换" : "粘贴你的 API Key"}"></label>`;
  div.innerHTML = `
    <h2>${esc(item.name)} <span class="tag">${esc(item.type)}</span> ${keyTag}
      ${item.name === selected ? '<span class="tag ok">使用中</span>' : ""}</h2>
    ${keyInput}
    ${fieldInput(item, "model_name", "模型名称")}
    ${fieldInput(item, "base_url", "接口地址")}
    ${fieldInput(item, "url", "接口地址")}
    <button>保存</button>`;
  div.querySelector("button").onclick = async () => {
    const body = {};
    div.querySelectorAll("input[data-field]").forEach((i) => { body[i.dataset.field] = i.value; });
    try { const r = await api("llm/" + encodeURIComponent(item.name), body); toast(appliedMsg(r)); await loadLLM(); }
    catch (e) { toast(e.message); }
  };
  return div;
}

async function loadLLM() {
  const data = await api("llm");
  const sel = $("llm-select");
  sel.innerHTML = "";
  for (const it of data.items) {
    const o = document.createElement("option");
    o.value = it.name;
    o.textContent = `${it.name}（${it.type}）${it.api_key_set === false ? " · Key 未设置" : ""}`;
    o.selected = it.name === data.selected;
    sel.appendChild(o);
  }
  $("running-hint").textContent = data.running === data.selected
    ? `服务正在使用：${data.running}`
    : `配置已选：${data.selected}；服务正在使用：${data.running}`;

  const list = $("llm-list");
  list.innerHTML = "";
  const pinned = (it) => it.name === data.selected || COMMON.includes(it.name);
  const rank = (it) => (it.name === data.selected ? -1 : COMMON.indexOf(it.name));
  data.items.filter(pinned).sort((a, b) => rank(a) - rank(b))
    .forEach((it) => list.appendChild(renderItem(it, data.selected)));
  const rest = data.items.filter((it) => !pinned(it));
  if (rest.length) {
    const more = document.createElement("details");
    more.innerHTML = `<summary>其他模型（${rest.length} 个）</summary>`;
    rest.forEach((it) => more.appendChild(renderItem(it, data.selected)));
    list.appendChild(more);
  }
}

$("setup-btn").onclick = async () => {
  if ($("setup-pw").value !== $("setup-pw2").value) return toast("两次输入的密码不一致");
  try { await api("setup", { password: $("setup-pw").value }); await route(); } catch (e) { toast(e.message); }
};
$("login-btn").onclick = async () => {
  try { await api("login", { password: $("login-pw").value }); $("login-pw").value = ""; await route(); }
  catch (e) { toast(e.message); }
};
$("login-pw").addEventListener("keydown", (e) => { if (e.key === "Enter") $("login-btn").click(); });
$("logout").onclick = async () => { await api("logout", {}); await route(); };
$("select-btn").onclick = async () => {
  try { const r = await api("llm/select", { name: $("llm-select").value }); toast(appliedMsg(r)); await loadLLM(); }
  catch (e) { toast(e.message); }
};

route();
</script>
</body>
</html>
