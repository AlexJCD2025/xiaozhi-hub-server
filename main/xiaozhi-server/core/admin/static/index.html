<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xiaozhi-hub 管理后台</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2129; --muted: #6b7280;
    --border: #e5e7eb; --primary: #2563eb; --primary-text: #ffffff;
    --ok: #15803d; --warn: #b45309; --err: #b91c1c; --tag: #eef2ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318; --card: #1a1d24; --text: #e5e7eb; --muted: #9ca3af;
      --border: #2d323c; --primary: #3b82f6; --primary-text: #ffffff;
      --ok: #4ade80; --warn: #fbbf24; --err: #f87171; --tag: #232a3d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--card);
           display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  header h1 { font-size: 16px; margin: 0; }
  nav { display: flex; gap: 4px; overflow-x: auto; padding: 8px 16px; background: var(--card);
        border-bottom: 1px solid var(--border); }
  nav button { margin: 0; background: none; color: var(--muted); padding: 6px 12px; white-space: nowrap; }
  nav button.active { background: var(--tag); color: var(--text); }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
          padding: 16px; margin-bottom: 12px; }
  .card h2 { font-size: 15px; margin: 0 0 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--muted); font-size: 13px; }
  .tag { background: var(--tag); border-radius: 4px; padding: 0 6px; font-size: 12px; font-weight: normal; }
  .tag.ok { color: var(--ok); } .tag.warn { color: var(--warn); } .tag.err { color: var(--err); }
  label { display: block; margin-top: 10px; font-size: 13px; color: var(--muted); }
  label .fname { opacity: .6; font-size: 12px; margin-left: 4px; }
  input, select, textarea { width: 100%; padding: 8px 10px; margin-top: 4px; border: 1px solid var(--border);
         border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
  textarea { min-height: 60px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  input[type=checkbox] { width: auto; margin-right: 6px; }
  button { margin-top: 12px; padding: 8px 16px; border: 0; border-radius: 6px; cursor: pointer;
           background: var(--primary); color: var(--primary-text); font: inherit; }
  button.link { background: none; color: var(--muted); padding: 0; margin: 0; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  .row > :first-child { flex: 1; }
  .hidden { display: none; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; margin-top: 8px; }
  .kv div:nth-child(odd) { color: var(--muted); }
  .kv code { word-break: break-all; }
  .check { display: flex; gap: 8px; padding: 6px 0; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .check:first-child { border-top: 0; }
  .check b { min-width: 7em; font-weight: 500; }
  .warnbox { border-left: 3px solid var(--warn); padding: 8px 12px; background: var(--tag); border-radius: 6px; margin-top: 8px; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 8px 16px; max-width: 90vw;
           border-radius: 6px; background: var(--text); color: var(--bg); opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: .92; }
  details summary { cursor: pointer; color: var(--muted); margin: 8px 0; }
</style>
</head>
<body>
<header>
  <h1>xiaozhi-hub 管理后台</h1>
  <button id="logout" class="link hidden">退出登录</button>
</header>
<nav id="tabs" class="hidden">
  <button data-tab="status" class="active">状态</button>
  <button data-tab="LLM">大模型</button>
  <button data-tab="ASR">语音识别</button>
  <button data-tab="TTS">语音合成</button>
  <button data-tab="Intent">意图识别</button>
</nav>
<main>
  <section id="setup" class="card hidden">
    <h2>设置管理后台密码</h2>
    <p class="muted">首次使用请设置访问密码（至少 6 位）。设置后，局域网内的其他设备也可以凭密码登录。</p>
    <label>密码<input id="setup-pw" type="password" autocomplete="new-password"></label>
    <label>再次输入<input id="setup-pw2" type="password" autocomplete="new-password"></label>
    <button id="setup-btn">设置并进入</button>
  </section>

  <section id="setup-remote" class="card hidden">
    <h2>尚未设置密码</h2>
    <p class="muted">为了安全，首次设置密码只能在运行服务的电脑上进行。请在那台电脑的浏览器中打开
      <code>http://127.0.0.1:8003/admin</code>。</p>
  </section>

  <section id="login" class="card hidden">
    <h2>登录</h2>
    <label>密码<input id="login-pw" type="password" autocomplete="current-password"></label>
    <button id="login-btn">登录</button>
  </section>

  <section id="panel" class="hidden"></section>
</main>
<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const SECTION_INFO = {
  LLM: { title: "大模型", hint: "选择对话使用的大模型。Claude CLI 使用本机已登录的 Claude Code；其他模型需要填写对应的 API Key。",
         common: ["ClaudeCLI", "ClaudeAPI", "ChatGLMLLM", "DeepSeekLLM", "AliLLM", "DoubaoLLM"] },
  ASR: { title: "语音识别", hint: "把设备说的话转成文字。FunASR 在本机运行，不需要联网；其他多为云端服务，需要密钥。切换后会在后台重新加载，本地模型需要几秒。",
         common: ["FunASR", "SherpaASR", "AliyunStreamASR", "DoubaoStreamASR"] },
  TTS: { title: "语音合成", hint: "把回复转成语音。EdgeTTS 免费且不需要密钥。修改后设备重新连接时生效。",
         common: ["EdgeTTS", "DoubaoTTS", "AliyunStreamTTS", "CosyVoiceSiliconflow"] },
  Intent: { title: "意图识别", hint: "使用 Claude CLI 时请选 nointent。function_call 需要模型支持工具调用，可使用插件（天气、新闻、音乐等）。",
            common: ["nointent", "function_call", "intent_llm"] },
};

const LABELS = {
  api_key: "API Key", base_url: "接口地址", url: "接口地址", model_name: "模型名称", model: "模型",
  cli_path: "CLI 路径（留空自动查找）", workdir: "工作目录（Claude Code 只能访问这里）",
  allowed_tools: "允许的工具（逗号分隔；默认只读：Read, Grep, Glob）", permission_mode: "权限模式",
  turn_timeout_seconds: "单轮超时（秒）", idle_timeout_seconds: "空闲多久关闭进程（秒）",
  resume_window_minutes: "多久内重连自动接着聊（分钟）", resume_keywords: "接续关键字（逗号分隔）",
  first_reply_filler: "填充语（回复慢时先说的话，留空关闭）", filler_delay_seconds: "多久没回复说填充语（秒）",
  max_tokens: "最大输出 token", temperature: "temperature", top_p: "top_p",
  extra_body: "附加请求参数（JSON，例如 {\"reasoning_effort\": \"none\"}）",
  voice: "音色", output_dir: "音频输出目录", functions: "插件（逗号分隔）", llm: "使用的模型",
  model_dir: "模型目录", language: "语言", appid: "AppID", access_token: "Access Token",
};

function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), 3200);
}

async function api(path, body) {
  const opts = body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  };
  const res = await fetch("/admin/api/" + path, opts);
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (res.status === 401 && path !== "login") { await route(); throw new Error("请重新登录"); }
  if (!res.ok || data.ok === false) throw new Error(data.error || ("请求失败：" + res.status));
  return data;
}

function show(id) {
  for (const s of ["setup", "setup-remote", "login", "panel"]) $(s).classList.toggle("hidden", s !== id);
  $("logout").classList.toggle("hidden", id !== "panel");
  $("tabs").classList.toggle("hidden", id !== "panel");
}

let currentTab = "status";
try { currentTab = localStorage.getItem("xz_admin_tab") || "status"; } catch (e) {}

async function route() {
  const st = await (await fetch("/admin/api/state")).json();
  if (st.needs_setup) show(st.is_local ? "setup" : "setup-remote");
  else if (!st.logged_in) show("login");
  else { show("panel"); await openTab(currentTab); }
}

async function openTab(tab) {
  currentTab = tab;
  try { localStorage.setItem("xz_admin_tab", tab); } catch (e) {}
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
  $("panel").innerHTML = '<p class="muted">加载中…</p>';
  try {
    if (tab === "status") await renderStatus(); else await renderSection(tab);
  } catch (e) { $("panel").innerHTML = `<div class="card">加载失败：${esc(e.message)}</div>`; }
}

// ---------- 状态 ----------

async function renderStatus() {
  const s = await api("status");
  const levelTag = { ok: '<span class="tag ok">正常</span>', warn: '<span class="tag warn">注意</span>', error: '<span class="tag err">异常</span>' };
  const mods = Object.entries(s.modules).map(([k, m]) =>
    `<div>${esc(SECTION_INFO[k].title)}</div><div>${esc(m.selected)} <span class="tag">${esc(m.type)}</span>
     ${m.running && m.running !== m.selected ? `<span class="tag warn">运行中：${esc(m.running)}</span>` : ""}</div>`).join("");
  $("panel").innerHTML = `
    <div class="card"><h2>连接地址</h2>
      <p class="muted">设备配网时填写 OTA 地址。请在路由器里给这台电脑设置固定 IP，否则 IP 变了设备会连不上。</p>
      <div class="kv">
        <div>本机 IP</div><div><code>${esc(s.addresses.ip)}</code></div>
        <div>OTA 地址</div><div><code>${esc(s.addresses.ota)}</code></div>
        <div>WebSocket</div><div><code>${esc(s.addresses.websocket)}</code></div>
        <div>管理后台</div><div><code>${esc(s.addresses.admin)}</code></div>
      </div></div>
    <div class="card"><h2>当前模块</h2><div class="kv">${mods}</div></div>
    <div class="card"><h2>环境自检</h2>
      ${s.checks.map((c) => `<div class="check"><b>${esc(c.name)}</b>${levelTag[c.level] || ""}<span class="muted">${esc(c.detail)}</span></div>`).join("")}
    </div>
    <button id="refresh">重新检查</button>`;
  $("refresh").onclick = () => openTab("status");
}

// ---------- 模块配置 ----------

function fieldHtml(f) {
  const label = `${esc(LABELS[f.name] || f.name)}${LABELS[f.name] ? `<span class="fname">${esc(f.name)}</span>` : ""}`;
  const attr = `data-field="${esc(f.name)}" data-kind="${f.kind}"`;
  if (f.kind === "secret")
    return `<label>${label}<input ${attr} type="password" autocomplete="off"
      placeholder="${f.set ? "已设置 " + esc(f.hint) + "，输入新值可替换" : "未设置，粘贴后保存"}"></label>`;
  if (f.kind === "bool")
    return `<label><input ${attr} type="checkbox" ${f.value ? "checked" : ""}>${label}</label>`;
  if (f.kind === "json")
    return `<label>${label}<textarea ${attr} spellcheck="false">${esc(f.value)}</textarea></label>`;
  if (f.kind === "list")
    return `<label>${label}<input ${attr} value="${esc(f.value.join(", "))}" autocomplete="off"></label>`;
  return `<label>${label}<input ${attr} value="${esc(f.value)}" autocomplete="off" ${f.kind === "number" ? 'inputmode="decimal"' : ""}></label>`;
}

function entryCard(section, e, selected, running) {
  const div = document.createElement("div");
  div.className = "card";
  const tags = [
    `<span class="tag">${esc(e.type)}</span>`,
    e.name === selected ? '<span class="tag ok">已选择</span>' : "",
    e.name === running && running !== selected ? '<span class="tag warn">运行中</span>' : "",
    e.needs_key ? '<span class="tag warn">缺少密钥</span>' : "",
  ].join(" ");
  const warn = section === "LLM" && e.type === "claude_cli"
    ? '<div class="warnbox muted">放开 Bash、Write、Edit 等工具后，语音指令就能在电脑上执行命令或修改文件，请谨慎。</div>' : "";
  div.innerHTML = `<h2>${esc(e.name)} ${tags}</h2>${warn}
    ${e.fields.length ? e.fields.map(fieldHtml).join("") : '<p class="muted">没有可编辑的字段。</p>'}
    <div class="row" style="justify-content:flex-start;gap:12px">
      ${e.fields.length ? '<button data-act="save">保存</button>' : ""}
      ${e.name !== selected ? '<button data-act="select">使用这个</button>' : ""}
    </div>`;
  const save = div.querySelector('[data-act="save"]');
  if (save) save.onclick = async () => {
    const body = {};
    div.querySelectorAll("[data-field]").forEach((i) => {
      body[i.dataset.field] = i.dataset.kind === "bool" ? i.checked : i.value;
    });
    try {
      const r = await api(`modules/${section}/entries/${encodeURIComponent(e.name)}`, body);
      toast(r.changed && r.changed.length ? r.note || "已保存" : "没有修改");
      await openTab(section);
    } catch (err) { toast(err.message); }
  };
  const sel = div.querySelector('[data-act="select"]');
  if (sel) sel.onclick = () => selectEntry(section, e.name);
  return div;
}

async function selectEntry(section, name) {
  try {
    if (section === "ASR") toast("正在切换语音识别，本地模型加载需要几秒…");
    const r = await api(`modules/${section}/select`, { name });
    toast(r.note || "已切换");
    await openTab(section);
  } catch (err) { toast(err.message); }
}

async function renderSection(section) {
  const info = SECTION_INFO[section];
  const data = await api("modules/" + section);
  const panel = $("panel");
  panel.innerHTML = `<div class="card"><h2>${esc(info.title)}</h2><p class="muted">${esc(info.hint)}</p>
    <div class="row"><label>当前选择<select id="sel">${data.entries.map((e) =>
      `<option value="${esc(e.name)}" ${e.name === data.selected ? "selected" : ""}>${esc(e.name)}（${esc(e.type)}）${e.needs_key ? " · 缺少密钥" : ""}</option>`).join("")}
    </select></label><button id="sel-btn">切换</button></div>
    ${data.running && data.running !== data.selected ? `<div class="warnbox muted">已选择 ${esc(data.selected)}，但服务仍在使用 ${esc(data.running)}。</div>` : ""}
    </div>`;
  $("sel-btn").onclick = () => selectEntry(section, $("sel").value);
  const rank = (e) => (e.name === data.selected ? -1 : info.common.indexOf(e.name));
  const isPinned = (e) => e.name === data.selected || info.common.includes(e.name);
  const pinned = data.entries.filter(isPinned).sort((a, b) => rank(a) - rank(b));
  const rest = data.entries.filter((e) => !isPinned(e));
  pinned.forEach((e) => panel.appendChild(entryCard(section, e, data.selected, data.running)));
  if (rest.length) {
    const more = document.createElement("details");
    more.innerHTML = `<summary>其他（${rest.length} 个）</summary>`;
    rest.forEach((e) => more.appendChild(entryCard(section, e, data.selected, data.running)));
    panel.appendChild(more);
  }
}

// ---------- 登录 ----------

$("setup-btn").onclick = async () => {
  if ($("setup-pw").value !== $("setup-pw2").value) return toast("两次输入的密码不一致");
  try { await api("setup", { password: $("setup-pw").value }); await route(); } catch (e) { toast(e.message); }
};
$("login-btn").onclick = async () => {
  try { await api("login", { password: $("login-pw").value }); $("login-pw").value = ""; await route(); }
  catch (e) { toast(e.message); }
};
$("login-pw").addEventListener("keydown", (e) => { if (e.key === "Enter") $("login-btn").click(); });
$("logout").onclick = async () => { await api("logout", {}); await route(); };
document.querySelectorAll("#tabs button").forEach((b) => { b.onclick = () => openTab(b.dataset.tab); });

route();
</script>
</body>
</html>
